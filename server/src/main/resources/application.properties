spring.application.name=jira

# MongoDB
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/jira_database}
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/jira_database}
spring.mongodb.database=jira_database

# Mail configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Server
server.port=${PORT:8080}

# Frontend URL for WebSocket
app.frontend.url=${FRONTEND_URL:http://localhost:3000}

# File uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# Attachment storage
app.attachments.directory=uploads/attachments